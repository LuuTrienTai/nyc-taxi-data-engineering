# Optional Week 2 Airflow services. Always use together with compose.yaml.
services:
  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: nyc-taxi-airflow:local
    profiles: [airflow]
    user: &airflow-user "${AIRFLOW_UID:-50000}:0"
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'True'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PYTHONPATH: /opt/project
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
    volumes: &airflow-volumes
      - ./:/opt/project
      - airflow_logs:/opt/airflow/logs
    command:
      - bash
      - -ec
      - |
        airflow db migrate
        if ! airflow users list | grep -q "$${AIRFLOW_ADMIN_USER:-admin}"; then
          airflow users create --username "$${AIRFLOW_ADMIN_USER:-admin}" --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname Local --lastname Admin --role Admin --email local-admin@example.invalid
        fi
  airflow-webserver:
    image: nyc-taxi-airflow:local
    profiles: [airflow]
    user: *airflow-user
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    command: webserver
    ports:
      - '127.0.0.1:${AIRFLOW_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL','curl --fail --silent http://localhost:8080/health >/dev/null']
      interval: 20s
      timeout: 10s
      retries: 10
  airflow-scheduler:
    image: nyc-taxi-airflow:local
    profiles: [airflow]
    user: *airflow-user
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
volumes:
  airflow_logs:
