name: nyc-taxi-platform
x-db-env: &db-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: '5432'
  POSTGRES_USER: ${POSTGRES_USER:-taxi_admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
  POSTGRES_DB: ${POSTGRES_DB:-nyc_taxi}
x-runner: &runner
  image: nyc-taxi-runner:local
  build:
    context: .
    dockerfile: docker/runner/Dockerfile
services:
  postgres:
    image: postgres:16
    environment: *db-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
  setup:
    <<: *runner
    command:
      - sh
      - -ec
      - chgrp 0 /opt/project/data && chmod 2775 /opt/project/data && exec python -m scripts.setup_services
    environment:
      <<: *db-env
      WEB_READER_PASSWORD: ${WEB_READER_PASSWORD:?Set WEB_READER_PASSWORD in .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
    volumes: [taxi_data:/opt/project/data]
    depends_on:
      postgres:
        condition: service_healthy
  runner:
    <<: *runner
    profiles: [tools]
    environment: *db-env
    volumes: [taxi_data:/opt/project/data]
    depends_on:
      setup:
        condition: service_completed_successfully
  dashboard:
    <<: *runner
    command: [python, -m, src.dashboard]
    restart: unless-stopped
    environment:
      <<: *db-env
      POSTGRES_USER: taxi_web_reader
      POSTGRES_PASSWORD: ${WEB_READER_PASSWORD:?Set WEB_READER_PASSWORD in .env}
    ports: ['127.0.0.1:${WEB_PORT:-8501}:8501']
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/api/catalog', timeout=5).close()"]
      interval: 10s
      timeout: 6s
      retries: 12
volumes:
  postgres_data:
  taxi_data:
