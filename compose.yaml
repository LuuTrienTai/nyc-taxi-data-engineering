name: nyc-taxi-gold
x-db-env: &db-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: '5432'
  POSTGRES_USER: ${POSTGRES_USER:-taxi_admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
  POSTGRES_DB: ${POSTGRES_DB:-nyc_taxi}
services:
  postgres:
    image: postgres:16
    environment:
      <<: *db-env
    ports: ['127.0.0.1:${POSTGRES_PORT:-5433}:5432']
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
  runner:
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
    profiles: [tools]
    environment:
      <<: *db-env
      METABASE_READER_PASSWORD: ${METABASE_READER_PASSWORD:-taxi_reader_demo_2026}
    volumes: ['./:/opt/project']
    depends_on:
      postgres:
        condition: service_healthy
  dashboard:
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
    command: [python, -m, src.dashboard]
    environment:
      <<: *db-env
      POSTGRES_USER: metabase_reader
      POSTGRES_PASSWORD: ${METABASE_READER_PASSWORD:-taxi_reader_demo_2026}
    ports: ['127.0.0.1:8501:8501']
    depends_on:
      postgres:
        condition: service_healthy
  metabase:
    image: metabase/metabase:v0.52.10
    ports: ['127.0.0.1:${METABASE_PORT:-3000}:3000']
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes: ['metabase_data:/metabase-data']
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  metabase_data:
